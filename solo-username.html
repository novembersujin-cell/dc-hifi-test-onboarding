<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Macroverse — Solo · Username</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="onboarding.css" />
  </head>
  <body>
    <main class="viewport">
      <div
        class="stage username"
        id="stage"
        data-screen="username"
        data-mode="solo"
        data-node-id="2078:3578"
      >
        <img
          class="bg bg-username-select"
          src="assets/bg-username-select.png"
          alt=""
          aria-hidden="true"
        />

        <header class="top-nav top-nav-split">
          <a class="back-btn" href="solo-age.html">
            <img
              class="back-arrow"
              src="assets/icon-back-h.svg"
              alt=""
              width="26"
              height="14"
              aria-hidden="true"
            />
            Back
          </a>
          <div
            class="lang-toggle"
            role="group"
            aria-label="Language"
            data-lang="en"
          >
            <button
              type="button"
              class="lang-btn is-active"
              data-lang-option="en"
              aria-pressed="true"
            >
              ENG
            </button>
            <button
              type="button"
              class="lang-btn"
              data-lang-option="es"
              aria-pressed="false"
            >
              ESP
            </button>
          </div>
        </header>

        <section class="username-body">
          <h1 class="username-title">Select a cube to get a username</h1>

          <div class="cube-row" role="group" aria-label="Username cubes">
            <button
              type="button"
              class="cube-btn cube-bob-a"
              data-cube="1"
              aria-label="Box 1"
            >
              <img
                class="cube-img"
                src="assets/box-1.png"
                alt=""
                width="475"
                height="632"
                draggable="false"
              />
            </button>
            <button
              type="button"
              class="cube-btn cube-bob-b"
              data-cube="2"
              aria-label="Box 2"
            >
              <img
                class="cube-img"
                src="assets/box-2.png"
                alt=""
                width="475"
                height="632"
                draggable="false"
              />
            </button>
            <button
              type="button"
              class="cube-btn cube-bob-c"
              data-cube="3"
              aria-label="Box 3"
            >
              <img
                class="cube-img"
                src="assets/box-3.png"
                alt=""
                width="475"
                height="632"
                draggable="false"
              />
            </button>
            <button
              type="button"
              class="cube-btn cube-bob-d"
              data-cube="4"
              aria-label="Box 4"
            >
              <img
                class="cube-img"
                src="assets/box-4.png"
                alt=""
                width="475"
                height="632"
                draggable="false"
              />
            </button>
          </div>
        </section>
      </div>
    </main>

    <script src="onboarding.js"></script>
  </body>
</html>

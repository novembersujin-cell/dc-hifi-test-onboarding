<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Macroverse — Onboarding</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="onboarding.css" />
  </head>
  <body>
    <main class="viewport">
      <div class="stage home" id="stage" data-screen="home" data-node-id="2078:3364">
        <img
          class="bg bg-home"
          src="assets/bg-home.png"
          alt=""
          aria-hidden="true"
        />
        <div class="home-floor-glow" aria-hidden="true"></div>

        <header class="top-nav">
          <div
            class="lang-toggle"
            role="group"
            aria-label="Language"
            data-lang="en"
          >
            <button
              type="button"
              class="lang-btn is-active"
              data-lang-option="en"
              aria-pressed="true"
            >
              ENG
            </button>
            <button
              type="button"
              class="lang-btn"
              data-lang-option="es"
              aria-pressed="false"
            >
              ESP
            </button>
          </div>
        </header>

        <section class="hero">
          <div class="brand-chip" aria-label="Macroverse">
            <img
              class="brand-logo"
              src="assets/logo-macroverse.svg"
              alt="MACROVERSE"
            />
          </div>
          <h1>
            <span>Shrink in Size,</span>
            <span>Grow in CHARACTER!</span>
          </h1>
        </section>

        <section class="choices" aria-label="Play mode">
          <a
            class="choice choice-solo"
            href="solo.html"
            data-mode="solo"
          >
            <img class="choice-shape" src="assets/btn-solo.svg" alt="" />
            <div class="choice-content">
              <span class="choice-label">Shrink Solo</span>
              <img class="choice-icon" src="assets/icon-user.svg" alt="" />
            </div>
          </a>

          <a
            class="choice choice-together"
            href="together.html"
            data-mode="together"
          >
            <img class="choice-shape" src="assets/btn-together.svg" alt="" />
            <div class="choice-content">
              <span class="choice-label">Shrink Together</span>
              <img class="choice-icon users" src="assets/icon-users.svg" alt="" />
            </div>
          </a>
        </section>
      </div>
    </main>

    <script src="onboarding.js"></script>
  </body>
</html>
